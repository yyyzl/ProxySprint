name: Desktop
on:
  push:
    branches: [master, 'feat/**']
    tags: ['v*']
  pull_request:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: build-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
          - platform: macOS-arm64
            os: macos-latest
          - platform: macOS-x86_64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Prepare dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Flutter dependencies
        run: flutter pub get
        working-directory: desktop
      - name: Download verified standalone core
        run: python scripts/download_test_core.py
      - name: Engine regression tests
        run: python scripts/run_engine_tests.py
      - name: Flutter analysis
        run: flutter analyze --no-pub
        working-directory: desktop
      - name: Flutter tests
        run: python -c "import shutil,subprocess; subprocess.run([shutil.which('flutter'),'test','--no-pub','--timeout','60s'],timeout=60,check=True)"
        working-directory: desktop
      - name: Build application bundle
        run: python scripts/build_bundle.py
      - name: macOS DMG mount and installation smoke test
        if: matrix.platform != 'Windows'
        run: python -c "import subprocess,sys; subprocess.run([sys.executable,'tests/macos_dmg.py'],timeout=60,check=True)"
      - name: Frozen engine smoke test
        if: matrix.platform != 'Windows'
        env:
          PROXYSPRINT_ENGINE_BINARY: ${{ github.workspace }}/work/dmg-install/Applications/ProxySprint.app/Contents/Resources/engine/probe-engine/probe-engine
        run: python -c "import subprocess,sys; subprocess.run([sys.executable,'tests/packaged_engine.py'],timeout=60,check=True)"
      - name: Build Windows installer
        if: matrix.platform == 'Windows'
        run: python scripts/build_installer.py
      - name: Windows install, upgrade and uninstall smoke test
        if: matrix.platform == 'Windows'
        run: python -c "import subprocess,sys; subprocess.run([sys.executable,'tests/windows_installer.py'],timeout=60,check=True)"
      - name: Download previous Windows release for upgrade verification
        if: matrix.platform == 'Windows'
        run: curl.exe --fail --silent --show-error --location --max-time 60 --retry 2 --output work/NodeScope-Setup-1.1.1.exe https://github.com/${{ github.repository }}/releases/download/v1.1.1/NodeScope-Setup.exe
      - name: NodeScope to ProxySprint upgrade smoke test
        if: matrix.platform == 'Windows'
        run: python -c "import subprocess,sys; subprocess.run([sys.executable,'tests/windows_installer.py','--previous-installer','work/NodeScope-Setup-1.1.1.exe'],timeout=60,check=True)"
      - uses: actions/upload-artifact@v4
        with:
          name: ProxySprint-${{ matrix.platform }}
          path: |
            dist/ProxySprint-*.zip
            dist/ProxySprint-*.dmg
            dist/ProxySprint-Setup.exe
          if-no-files-found: error
  release:
    name: Publish all desktop packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ProxySprint-*
          merge-multiple: true
          path: work/release
      - name: Validate complete release and write checksums
        run: python scripts/prepare_release.py
      - uses: softprops/action-gh-release@v2
        with:
          body_path: work/release-notes.md
          files: |
            work/release/ProxySprint-Setup.exe
            work/release/ProxySprint-Windows-x64.zip
            work/release/ProxySprint-macOS-arm64.dmg
            work/release/ProxySprint-macOS-x86_64.dmg
            work/release/SHA256SUMS.txt
          fail_on_unmatched_files: true
